services:
  iptv-proxy:
    image: ghcr.io/jad-haddad/iptv-proxy:latest
    environment:
      MTV_BASE_URL: https://www.mtv.com.lb
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/iptv-proxy", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
